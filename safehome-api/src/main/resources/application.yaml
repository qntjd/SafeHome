spring:
  profiles:
    active: local

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:safehome}
    username: ${DB_USERNAME:safehome}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      # 커넥션이 오래 방치돼 있으면(네트워크 끊김 등) 강제로 재활용해서 풀이 영구히 막히지 않게 함
      idle-timeout: 300000        # 5분 이상 idle이면 반납
      max-lifetime: 1800000       # 30분 지나면 무조건 새 커넥션으로 교체
      connection-timeout: 30000
      # 60초 넘게 안 반납되는 커넥션이 있으면 어디서 가져갔는지 스택트레이스와 함께 경고 로그
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "https://safehome-api.duckdns.org/login/oauth2/code/google"

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 604800000
  refresh-expiration: 2592000000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

public-api:
  disaster:
    url: https://www.safetydata.go.kr/V2/api/DSSP-IF-00247
    key: ${DISASTER_API_KEY:YOUR_API_KEY}
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

aligo:
  api-key: ${ALIGO_API_KEY:}
  user-id: ${ALIGO_USER_ID:}
  sender: ${ALIGO_SENDER:}